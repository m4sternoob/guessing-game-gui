name: Build macOS app (Swift)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release

      - name: Assemble .app bundle
        run: |
          set -euo pipefail
          APP="5IN1.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/GuessingGame "$APP/Contents/MacOS/GuessingGame"
          cp packaging/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/GuessingGame"

      - name: Generate app icon
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 packaging/generate_icon.py

      - name: Build .icns from icon
        run: |
          set -euo pipefail
          ICONSET="AppIcon.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          sips -z 16 16     packaging/AppIcon-1024.png --out "$ICONSET/icon_16x16.png" > /dev/null
          sips -z 32 32     packaging/AppIcon-1024.png --out "$ICONSET/icon_16x16@2x.png" > /dev/null
          sips -z 32 32     packaging/AppIcon-1024.png --out "$ICONSET/icon_32x32.png" > /dev/null
          sips -z 64 64     packaging/AppIcon-1024.png --out "$ICONSET/icon_32x32@2x.png" > /dev/null
          sips -z 128 128   packaging/AppIcon-1024.png --out "$ICONSET/icon_128x128.png" > /dev/null
          sips -z 256 256   packaging/AppIcon-1024.png --out "$ICONSET/icon_128x128@2x.png" > /dev/null
          sips -z 256 256   packaging/AppIcon-1024.png --out "$ICONSET/icon_256x256.png" > /dev/null
          sips -z 512 512   packaging/AppIcon-1024.png --out "$ICONSET/icon_256x256@2x.png" > /dev/null
          sips -z 512 512   packaging/AppIcon-1024.png --out "$ICONSET/icon_512x512.png" > /dev/null
          sips -z 1024 1024 packaging/AppIcon-1024.png --out "$ICONSET/icon_512x512@2x.png" > /dev/null
          iconutil -c icns "$ICONSET" -o "5IN1.app/Contents/Resources/AppIcon.icns"

      - name: Diagnose bundle before signing
        run: |
          set -euo pipefail
          sw_vers
          codesign --version || true
          echo "--- existing signature on built binary ---"
          codesign -dv .build/release/GuessingGame 2>&1 || true
          echo "--- existing signature on assembled bundle ---"
          codesign -dv "5IN1.app" 2>&1 || true
          echo "--- xattrs on bundle ---"
          xattr -lr "5IN1.app" 2>/dev/null | head -20 || true
          echo "--- bundle layout ---"
          find "5IN1.app" -type f

      - name: EXPERIMENT - isolate codesign bundle failure (non-fatal, diagnostic run)
        run: |
          set -euo pipefail
          echo "=== A: sign inner binary directly ==="
          codesign --force --sign - "5IN1.app/Contents/MacOS/GuessingGame" && echo "A_OK_BINARY_SIGNED" || echo "A_FAIL"
          echo "=== B: minimal bundle without Resources ==="
          rm -rf Mini.app && mkdir -p Mini.app/Contents/MacOS
          cp .build/release/GuessingGame Mini.app/Contents/MacOS/Mini
          cp packaging/Info.plist Mini.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Mini" Mini.app/Contents/Info.plist
          codesign --force --sign - "Mini.app" && echo "B_OK" || echo "B_FAIL"
          echo "=== C: identical content, different bundle name ==="
          rm -rf GameHub.app && cp -R 5IN1.app GameHub.app
          codesign --force --sign - "GameHub.app" && echo "C_OK" || echo "C_FAIL"
          echo "=== D: absolute path ==="
          codesign --force --sign - "$PWD/5IN1.app" && echo "D_OK" || echo "D_FAIL"
          echo "=== E: explicit identifier ==="
          codesign --force --sign - -i com.guessinggame.gui "5IN1.app" && echo "E_OK" || echo "E_FAIL"
          echo "=== experiments done ==="

      # TEMPORARILY DISABLED for the diagnostic run (restored after root cause is found):
      # - Verify bundle
      # - Package zip
      # - Upload artifact
